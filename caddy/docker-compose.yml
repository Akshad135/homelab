services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "8000-8999:8000-8999"
      - "9001:9001"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data:/data
      - ./config:/config
      - /home/ubuntu/adguard-certs:/mnt/certs:ro

    networks:
      - homelab

networks:
  homelab:
    external: true
