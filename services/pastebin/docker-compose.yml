services:
  pastebin:
    image: akshad135/ghostbin:latest
    container_name: pastebin-server
    restart: unless-stopped

    environment:
      AUTH_KEY: "${AUTH_KEY:-your_auth_key_here}"
      RUST_LOG: "info"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://akshad.duckdns.org:8005}"

    volumes:
      - pastebin_pastebin-data:/app/data

    networks:
      - homelab

volumes:
  pastebin_pastebin-data:
    external: true

networks:
  homelab:
    external: true
